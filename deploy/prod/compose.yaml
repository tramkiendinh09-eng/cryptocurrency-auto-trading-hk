services:
  dca-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dca-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:28080:5174"
    environment:
      TZ: Asia/Shanghai

  dca-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dca-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:28081:8080"
    volumes:
      - ./data/upload:/data/upload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms512m -Xmx1024m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/captchaImage"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  feed-adapter:
    build:
      context: ./feed-adapter
      dockerfile: Dockerfile
    container_name: dca-feed-adapter
    restart: unless-stopped
    env_file:
      - ./feed-adapter/.env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    container_name: dca-python-worker
    restart: unless-stopped
    env_file:
      - ./python-worker/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      WORKER_PROFILE: trade_runtime
      TRADE_RUNTIME_RUN_MODE: forever
    depends_on:
      dca-backend:
        condition: service_started
      feed-adapter:
        condition: service_healthy
