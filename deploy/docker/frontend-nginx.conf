server {
    listen 5174;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /prod-api/ {
        proxy_pass http://dca-backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Routes SecurityConfig leaves unauthenticated for the worker's benefit.
    # The worker reaches the backend over the compose network, not through here.
    # /dca/ai/models/config/* hands out the decrypted model API key.
    location /prod-api/dca/ai/models/config/ { return 404; }
    location /prod-api/dca/callback         { return 404; }
    location /prod-api/druid                { return 404; }
    location /prod-api/swagger-ui           { return 404; }
    location /prod-api/v3/api-docs          { return 404; }
}
