# DCA trading console.
#
# The Spring Boot app, the feed adapter and Redis all bind to 127.0.0.1 only;
# this server block is the single public surface. Adjust `listen` / `server_name`
# (and put TLS in front) before exposing it beyond a trusted network.

server {
    listen 8099;
    listen [::]:8099;
    server_name _;

    root /opt/dca/app/frontend;
    index index.html;

    client_max_body_size 20m;

    # The console is an operator tool, not a public site.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- console SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- API ---
    # The production frontend build calls /prod-api/*; strip the prefix.
    location /prod-api/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- the worker's private control channel: never proxy it ---
    #
    # 43 endpoints under /dca/ carry @Anonymous, because the worker/backend
    # protocol assumes both ends sit on a trusted network. The worker here talks
    # to 127.0.0.1:18081 directly, so none of this needs to traverse the proxy.
    # Each rule below was checked against dca-ui's API layer first: everything
    # denied is something the console never calls.
    #
    # Prefix denials — whole controllers the console does not use:
    #
    #   ai/models/config/{default,id} returns the DECRYPTED model API key as
    #   plaintext to any caller, so proxying it publishes your LLM credentials.
    location /prod-api/dca/ai/models/config/ { return 404; }
    #   callback/** accepts unauthenticated trade and alert writes.
    location /prod-api/dca/callback          { return 404; }
    #   event/ingest injects market/news/onchain/social events straight into the
    #   decision graph — the cheapest way to steer someone else's trading.
    location /prod-api/dca/event/            { return 404; }
    #   taskqueue/{pull,result,heartbeat} would let a stranger impersonate the
    #   worker and answer its tasks.
    location /prod-api/dca/taskqueue/        { return 404; }
    location /prod-api/dca/agent-memory/     { return 404; }
    location /prod-api/dca/trade-lifecycle/  { return 404; }
    location /prod-api/dca/market/api/config/enabled/ { return 404; }

    # Exact-match denials. These sit beside console routes that differ by a
    # single character (event/events, session/sessions), so prefix rules here
    # would break the Replay Console — `location =` matches the full path only.
    location = /prod-api/dca/trade/runtime/model-call { return 404; }
    location = /prod-api/dca/trade/execution/order             { return 404; }
    location = /prod-api/dca/trade/execution/exchange-order    { return 404; }
    location = /prod-api/dca/trade/execution/exchange-fill     { return 404; }
    location = /prod-api/dca/trade/execution/pnl-snapshot      { return 404; }
    location = /prod-api/dca/trade/execution/position-snapshot { return 404; }
    location = /prod-api/dca/trade/execution/risk-guard-hit    { return 404; }
    location = /prod-api/dca/trade/replay/event           { return 404; }
    location = /prod-api/dca/trade/replay/paper-order     { return 404; }
    location = /prod-api/dca/trade/replay/session         { return 404; }
    location = /prod-api/dca/trade/replay/shadow-decision { return 404; }
    #
    # Left reachable on purpose, because the console genuinely calls them and
    # they are read-only: /dca/trade/runtime/config, /dca/decision/runs,
    # /dca/trade/replay/source, /dca/trade/constants/*.

    # Druid ships with statViewServlet enabled and an empty allow-list, and the
    # OpenAPI routes describe every trading endpoint. Neither belongs on a
    # listening socket; reach them over an SSH tunnel to 127.0.0.1:18081 instead.
    location /prod-api/druid       { return 404; }
    location /prod-api/swagger-ui  { return 404; }
    location /prod-api/v3/api-docs { return 404; }
}
